<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Hunt: Behind the Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #00050a; color: white; font-family: 'Inter', sans-serif; }
        
        #ui-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            z-index: 100;
        }

        .header h1 { 
            font-family: 'Orbitron', sans-serif; 
            margin: 0; color: #0ff; 
            font-size: 1.8rem; 
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .info-panel {
            pointer-events: auto;
            max-width: 500px;
            background: rgba(0, 20, 40, 0.8);
            padding: 30px;
            border-radius: 4px;
            border-left: 4px solid #0ff;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.5s ease-out;
        }
        .info-panel.visible { opacity: 1; transform: translateX(0); }
        .info-panel h2 { font-family: 'Orbitron', sans-serif; color: #0ff; margin-top: 0; font-size: 1.2rem; letter-spacing: 1px; }
        .info-panel p { line-height: 1.6; color: #b0d0d0; font-size: 0.95rem; }

        .navigation {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn {
            background: transparent;
            border: 1px solid #0ff;
            color: #0ff;
            padding: 10px 25px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .btn:hover { background: rgba(0, 255, 255, 0.1); box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
        
        .progress-indicator { color: #446; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; }

        #canvas-webgl { position: fixed; top: 0; left: 0; outline: none; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div class="header">
            <h1>Dev Report: Core Hunt</h1>
        </div>

        <div id="slide-hub" class="info-panel">
            <h2 id="hub-title">The Project Scope</h2>
            <p id="hub-desc">Analyzing core architecture...</p>
        </div>

        <div class="navigation">
            <button class="btn" onclick="changeSlide(-1)">Prev</button>
            <div class="progress-indicator">LOG <span id="curr-num">1</span> / 10</div>
            <button class="btn" onclick="changeSlide(1)">Next</button>
        </div>
    </div>

    <canvas id="canvas-webgl"></canvas>

    <script>
        let scene, camera, renderer, clock, particles;
        let currentIdx = 0;
        
        const hubs = [
            {
                title: "Concept: Hyper-Magnet Breach",
                desc: "My goal was to create an 'invisible' interface. I built a game called Core Hunt where you use your physical hands to infiltrate a mainframe, inspired by the classic mechanics of Pac-Man but rebuilt for Augmented Reality.",
                pos: { x: 0, y: 0, z: 15 },
                lookAt: { x: 0, y: 0, z: 0 }
            },
            {
                title: "Sector-Based Progression",
                desc: "I designed the game to get harder as you go. There are 3 distinct Sectors: Breach, Firewall, and Overload. Each stage increases the speed of the ghosts and the amount of data points you need to collect to win.",
                pos: { x: 12, y: 5, z: -5 },
                lookAt: { x: 8, y: 0, z: -10 }
            },
            {
                title: "Hand Tracking with MediaPipe",
                desc: "The game feels like magic because it uses the MediaPipe library to track 21 points on your hand via the webcam. I mapped these coordinates so that moving your palm in front of the camera controls the character on screen.",
                pos: { x: -10, y: 10, z: -15 },
                lookAt: { x: -5, y: 5, z: -20 }
            },
            {
                title: "The Hyper-Magnet",
                desc: "In the final sector, things get intense. I added a special ability: The Hyper-Magnet. Once you collect enough data to charge it, you can trigger a 2-second 'vacuum' surge that pulls all nearby dots toward you.",
                pos: { x: -15, y: -5, z: -30 },
                lookAt: { x: -20, y: -10, z: -35 }
            },
            {
                title: "Gesture Controls: The Pinch",
                desc: "To make the Magnet feel natural, I coded a pinch detector. By calculating the distance between the tip of your thumb and index finger, the game knows exactly when you're 'grabbing' the power-up.",
                pos: { x: 5, y: -15, z: -40 },
                lookAt: { x: 0, y: -10, z: -45 }
            },
            {
                title: "Ghost AI and Stability",
                desc: "I spent a lot of time on the ghosts. They aren't just random; they follow a movement logic that makes them hunt the player. I also added a 'Stability' system (lives) that sever the link if you're caught too many times.",
                pos: { x: 20, y: 10, z: -20 },
                lookAt: { x: 25, y: 12, z: -25 }
            },
            {
                title: "Safety Feature: The Face Cover",
                desc: "Since hand tracking can be sensitive, I needed a way to quit instantly. I programmed an 'Emergency Shutdown.' If the camera detects both hands covering your face, the game aborts the mission immediately.",
                pos: { x: 30, y: 0, z: 0 },
                lookAt: { x: 35, y: 0, z: -10 }
            },
            {
                title: "Visual Feedback (HUD)",
                desc: "I used Tailwind CSS to build a high-tech HUD. It shows your 'Sync %' (score) and your ability charge. It was important that the UI felt like a futuristic computer terminal to match the 'Core Hunt' theme.",
                pos: { x: 10, y: 25, z: 10 },
                lookAt: { x: 10, y: 15, z: 0 }
            },
            {
                title: "Audio Feedback",
                desc: "I didn't use recorded sound files. Instead, I used the Web Audio API to generate synthetic 'beeps' and 'saws' in real-time. This keeps the file size small and makes the sounds feel more 'digital.'",
                pos: { x: -25, y: 15, z: 20 },
                lookAt: { x: -20, y: 10, z: 10 }
            },
            {
                title: "Final Mission Data",
                desc: "Building Core Hunt taught me how to blend computer vision with game logic. It's a fully functional AR experience that runs entirely in the browser without any extra hardware.",
                pos: { x: 0, y: 0, z: 45 },
                lookAt: { x: 0, y: 0, z: 0 }
            }
        ];

        window.onload = init;

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x00050a, 0.05);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-webgl'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            clock = new THREE.Clock();

            // Minimal Tech Lighting
            const pLight = new THREE.PointLight(0x00ffff, 1, 100);
            pLight.position.set(0, 10, 0);
            scene.add(pLight);
            scene.add(new THREE.AmbientLight(0x112233, 0.5));

            createObjects();
            updateUI();
            animate();

            camera.position.set(hubs[0].pos.x, hubs[0].pos.y, hubs[0].pos.z);
        }

        function createObjects() {
            // Background Grid & Particles
            const partGeom = new THREE.BufferGeometry();
            const partPos = [];
            for(let i=0; i<3000; i++) {
                partPos.push(THREE.MathUtils.randFloatSpread(200), THREE.MathUtils.randFloatSpread(200), THREE.MathUtils.randFloatSpread(200));
            }
            partGeom.setAttribute('position', new THREE.Float32BufferAttribute(partPos, 3));
            particles = new THREE.Points(partGeom, new THREE.PointsMaterial({ color: 0x00ffff, size: 0.1, transparent: true, opacity: 0.5 }));
            scene.add(particles);

            // Tech Hubs
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            hubs.forEach((h, i) => {
                const mesh = new THREE.Mesh(
                    new THREE.IcosahedronGeometry(1.5, 0), 
                    new THREE.MeshPhongMaterial({ color: 0x00ffff, wireframe: true })
                );
                mesh.position.set(h.lookAt.x, h.lookAt.y, h.lookAt.z);
                mesh.name = "hub_" + i;
                scene.add(mesh);
            });
        }

        function changeSlide(dir) {
            currentIdx = THREE.MathUtils.clamp(currentIdx + dir, 0, hubs.length - 1);
            const h = hubs[currentIdx];
            
            new TWEEN.Tween(camera.position)
                .to({ x: h.pos.x, y: h.pos.y, z: h.pos.z }, 1500)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();

            updateUI();
        }

        function updateUI() {
            const panel = document.getElementById('slide-hub');
            panel.classList.remove('visible');
            
            setTimeout(() => {
                const h = hubs[currentIdx];
                document.getElementById('hub-title').innerText = h.title;
                document.getElementById('hub-desc').innerText = h.desc;
                document.getElementById('curr-num').innerText = currentIdx + 1;
                panel.classList.add('visible');
            }, 400);
        }

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            const time = clock.getElapsedTime();

            const target = hubs[currentIdx].lookAt;
            camera.lookAt(target.x, target.y, target.z);

            scene.traverse(obj => {
                if(obj.name.startsWith("hub_")) {
                    obj.rotation.y += 0.01;
                    obj.rotation.x += 0.005;
                }
            });

            particles.rotation.y += 0.0005;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
